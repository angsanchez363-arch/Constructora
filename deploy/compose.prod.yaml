# Producción (servidor propio): API + PostgreSQL con healthchecks, reinicio y rotación de logs.
# Uso (desde la raíz del repo):
#   cp .env.example .env && chmod 600 .env
#   docker compose -f deploy/compose.prod.yaml --env-file .env up -d --build --wait
name: constructora

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    volumes:
      - datos:/var/lib/postgresql/data
      - ../server/sql:/sql:ro
      - ../respaldos:/respaldos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  api:
    build: ../server
    image: constructora-api:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en .env}
      DB_SSL: ${DB_SSL:-false}
      PORT: ${PORT:-8000}
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"   # detrás de un proxy inverso con HTTPS
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  datos:
